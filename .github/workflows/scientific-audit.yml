name: Scientific audit

on:
  push:
    branches:
      - audit/fix-p0-validation-2026-11-12
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib pytest
      - name: Run automated tests
        run: python -m pytest -q audit/tests
      - name: Run complete nonlinear thermal-plant validation
        run: python audit/numerical_validation/validate_thermal_budget.py
      - name: Regenerate numerical validation reports
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            echo "::group::${script}"
            python "${script}"
            echo "::endgroup::"
          done < <(find audit/numerical_validation -maxdepth 1 -type f -name 'validate_*.py' ! -name 'validate_thermal_budget.py' | sort)
      - name: Regenerate MPC ADMM validation report
        run: python audit/mpc/validate_mpc_admm.py
      - name: Regenerate SDP scheduler validation report
        run: python audit/sdp/validate_sdp_scheduler.py
      - name: Retrain and regenerate PINN comparison report
        run: python experiments/validar_pinn.py
      - name: Upload regenerated numerical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-validation-reports
          path: |
            audit/numerical_validation/*.json
            audit/pinn/*.json
            audit/mpc/*.json
            audit/sdp/*.json
          if-no-files-found: warn

  latex-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra texlive-publishers
      - name: Compile Elsevier manuscript
        working-directory: docs/elsevier
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Upload compiled manuscript and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elsevier-manuscript-build
          path: |
            docs/elsevier/main.pdf
            docs/elsevier/main.log
          if-no-files-found: warn
